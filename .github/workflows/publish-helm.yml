name: Publish Helm chart

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Both workflows publish to the same gh-pages branch, so they must not run at
  # once — but they must not cancel each other either: they deploy different
  # things (the Hugo site and the Helm chart index) and a push touching both
  # used to silently drop one of the two deploys. Queue instead of cancelling.
  group: deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Package chart
        run: |
          mkdir -p chart-output
          helm package charts/xslt-playground -d chart-output

      - name: Generate chart index
        run: |
          cd chart-output
          helm repo index . --url "https://blog.xsltplayground.com"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: chart-output
          destination_dir: docs
          keep_files: true
