name: Publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend

  # The Go tests existed but nothing ran them.
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/src/go.sum
      - name: Vet and test
        run: go vet ./... && go test ./...
        working-directory: backend/src

  # The whole stack in containers, driven by a real browser (e2e/). Each test
  # is one of this autumn's production failures: the auto-run that sent a
  # request per keystroke, the ad refresh that did nothing, an env.js broken
  # by a quote, generic compile errors, a runaway stylesheet. Images are only
  # published if they pass.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        run: docker compose -f docker-compose.local.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait until it answers
        run: |
          for i in $(seq 1 120); do
            curl -sf localhost:8000/healthz >/dev/null && curl -sf localhost:3000/ >/dev/null && curl -sf localhost:3001/ >/dev/null && exit 0
            sleep 2
          done
          docker compose -f docker-compose.local.yml -f docker-compose.e2e.yml logs
          exit 1
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run the tests
        run: |
          # The smoke spec lives in the Helm chart (it also runs in the cluster)
          # and needs @playwright/test resolvable from its own directory.
          ln -sfn "$GITHUB_WORKSPACE/e2e/node_modules" "$GITHUB_WORKSPACE/charts/xslt-playground/files/smoke/node_modules"
          npx playwright test
        working-directory: e2e
      - name: Backend logs
        if: failure()
        run: docker compose -f docker-compose.local.yml -f docker-compose.e2e.yml logs backend | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The built-in GITHUB_TOKEN has no write access to these packages, so every
      # push since 1773a0c failed with "denied: permission_denied: write_package"
      # and the images silently stopped being rebuilt. Use a PAT with
      # write:packages until the packages grant this repo write access, at which
      # point GITHUB_TOKEN can come back.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/xslt-playground-backend:latest


      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/xslt-playground-frontend:latest


          
