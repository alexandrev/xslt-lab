name: Publish Hugo site

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/publish-hugo.yml"
  workflow_dispatch:

concurrency:
  # Both workflows publish to the same gh-pages branch, so they must not run at
  # once — but they must not cancel each other either: they deploy different
  # things (the Hugo site and the Helm chart index) and a push touching both
  # used to silently drop one of the two deploys. Queue instead of cancelling.
  group: deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Build
        run: hugo --source site --minify --destination ../hugo-output

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hugo-output
          publish_branch: gh-pages
          destination_dir: docs
          keep_files: true
          # No cname: the custom domain was removed from GitHub Pages. Its
          # certificate could not renew once blog.* stopped pointing at GitHub
          # (the DNS moved with the /blog/ migration in July), and the NPM proxy
          # now reaches the site at alexandrev.github.io, which is covered by the
          # stable *.github.io certificate. Re-adding this line would restore the
          # custom domain on the next deploy and bring the problem back.
