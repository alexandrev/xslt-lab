worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Internal endpoint scraped by the nginx-prometheus-exporter sidecar.
    # Bound to localhost only; never reachable from outside the pod.
    server {
        listen 127.0.0.1:8081;
        location = /stub_status {
            stub_status;
        }
        location / {
            return 404;
        }
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Long-lived cache for hashed assets (JS/CSS chunks)
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Cache static assets
        location ~* \.(svg|ico|png|jpg|jpeg|woff2|woff)$ {
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # env.js must never be cached (runtime config)
        location = /env.js {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }

        # Relative redirects: behind the ingress nginx only sees http and its
        # own host, so an absolute Location would point at the wrong place.
        absolute_redirect off;

        # One URL per page. /xpath-tester was served as well as /xpath-tester/
        # (try_files found the directory), and Google indexed both.
        location ~ ^/(xpath-tester|xslt-2-0|xslt-3-0|xml-to-json|sponsor)$ {
            return 301 /$1/$is_args$args;
        }

        # A file that does not exist is a 404, not the app. Without this, any
        # missing .json/.txt/.xml came back as index.html with a 200, so agents
        # probing for /ai-catalog.json or /.well-known/* got HTML they tried to
        # parse as JSON, and crawlers saw a soft 404.
        location ~* \.(json|txt|xml|webmanifest|map)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location ^~ /.well-known/ {
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
