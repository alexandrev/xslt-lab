apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xslt-playground.fullname" . }}-backend
  labels:
    {{- include "xslt-playground.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      {{- include "xslt-playground.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "xslt-playground.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          env:
{{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.backendPort | quote }}
{{- end }}
{{- if .Values.storage.enabled }}
            - name: DATABASE_URL
              value: {{ .Values.storage.databaseUrl | quote }}
{{- else }}
            - name: DISABLE_DATABASE
              value: "true"
{{- end }}
{{- if .Values.firebase.enabled }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ printf "%s/%s" .Values.firebase.credentialsMountPath .Values.firebase.credentialsKey | quote }}
{{- end }}
          volumeMounts:
{{- if .Values.firebase.enabled }}
            - name: firebase
              mountPath: {{ .Values.firebase.credentialsMountPath }}
              readOnly: true
{{- end }}
          resources: {{- toYaml .Values.resources.backend | nindent 12 }}
          # /healthz asks the three JVM daemons whether they are answering, which
          # "is the Go process alive?" cannot tell you: on 2026-09-18 the Saxon 12
          # daemon ran out of heap and every XSLT 3.0 request timed out for forty
          # minutes while the pod reported Ready with zero restarts.
          # The failureThresholds are deliberately slack — one slow answer under
          # load is not a dead daemon, and restarting a pod costs a JVM warm-up.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # start.sh only execs the Go server once all three daemons answer,
            # so a slow boot cannot trip this; the delay covers image pull jitter.
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - containerPort: {{ .Values.service.backend.port }}
              name: http
{{- if .Values.metrics.enabled }}
            - containerPort: {{ .Values.metrics.backendPort }}
              name: metrics
{{- end }}
{{- if .Values.firebase.enabled }}
      volumes:
        - name: firebase
          secret:
            secretName: {{ .Values.firebase.secretName }}
            items:
              - key: {{ .Values.firebase.credentialsKey }}
                path: {{ .Values.firebase.credentialsKey }}
{{- end }}

